<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" width="1500" height="760" role="img" aria-label="Proofline claim verification loop"><defs><marker id="a-17324F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#17324F"/></marker><marker id="a-1B766F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#1B766F"/></marker><marker id="a-B97A1D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#B97A1D"/></marker><marker id="a-8895A3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#8895A3"/></marker><marker id="a-0F2236" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#0F2236"/></marker></defs><rect width="1500" height="760" fill="#F6F4EE"/><text x="48" y="60" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#0F2236" text-anchor="start">Claim verification loop</text><text x="48" y="88" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#4A5B6E" text-anchor="start">A model may draft the narrative. Nothing it writes is published until deterministic checks accept it.</text><line x1="48" y1="108" x2="1452" y2="108" stroke="#D9D4C7" stroke-width="1.2"/><rect x="48" y="160" width="210" height="110" rx="10" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="1.5"/><text x="64" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="650" fill="#0F2236" text-anchor="start">Findings and evidence</text><text x="64" y="212" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">Validated evidence items</text><text x="64" y="231" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">and the findings computed</text><text x="64" y="250" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">from them.</text><rect x="318" y="160" width="210" height="110" rx="10" fill="#FBF1DD" stroke="#B97A1D" stroke-width="1.5"/><text x="334" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="650" fill="#0F2236" text-anchor="start">Narrator</text><text x="334" y="212" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">Drafts claims: statement,</text><text x="334" y="231" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">cited evidence, numeric</text><text x="334" y="250" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">facts, structural checks.</text><rect x="588" y="140" width="320" height="190" rx="10" fill="#E1EFEC" stroke="#1B766F" stroke-width="1.5"/><text x="604" y="168" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="650" fill="#0F2236" text-anchor="start">Verifier</text><text x="604" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">1  cited evidence exists and is</text><text x="604" y="211" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">    validated</text><text x="604" y="230" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">2  every number recomputed</text><text x="604" y="249" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">3  every record id is cited</text><text x="604" y="268" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">4  structural checks hold</text><text x="604" y="287" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">5  no legal conclusions</text><polygon points="1030,173 1108,235 1030,297 952,235" fill="#FFFFFF" stroke="#17324F" stroke-width="1.8"/><text x="1030" y="231" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="650" fill="#0F2236" text-anchor="middle">All claims</text><text x="1030" y="249" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="650" fill="#0F2236" text-anchor="middle">pass?</text><rect x="1176" y="180" width="276" height="110" rx="10" fill="#FFFFFF" stroke="#1B766F" stroke-width="1.5"/><text x="1192" y="208" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="650" fill="#0F2236" text-anchor="start">Verified claims</text><text x="1192" y="232" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">Go into the case package</text><text x="1192" y="251" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">with their evidence links.</text><rect x="760" y="410" width="300" height="96" rx="10" fill="#FBF1DD" stroke="#B97A1D" stroke-width="1.5"/><text x="776" y="438" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="650" fill="#0F2236" text-anchor="start">Rejected, with reasons</text><text x="776" y="462" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">fact_value_mismatch, ungrounded_number,</text><text x="776" y="481" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">uncited_record_id, legal_conclusion ...</text><rect x="1176" y="410" width="276" height="96" rx="10" fill="#FFFFFF" stroke="#8895A3" stroke-width="1.5"/><text x="1192" y="438" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="650" fill="#0F2236" text-anchor="start">Withheld</text><text x="1192" y="462" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">Still failing after 3 rounds:</text><text x="1192" y="481" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">never published.</text><path d="M258,215 L318,215" fill="none" stroke="#17324F" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-17324F)"/><path d="M528,215 L588,215" fill="none" stroke="#17324F" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-17324F)"/><path d="M908,235 L952,235" fill="none" stroke="#17324F" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-17324F)"/><path d="M1108,235 L1176,235" fill="none" stroke="#1B766F" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-1B766F)"/><text x="1142" y="224" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="650" fill="#1B766F" text-anchor="middle">yes</text><path d="M1030,297 L1030,410" fill="none" stroke="#B97A1D" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-B97A1D)"/><text x="1042" y="360" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="650" fill="#B97A1D" text-anchor="start">no</text><path d="M760,458 L423,458 L423,270" fill="none" stroke="#B97A1D" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-B97A1D)"/><text x="590" y="448" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#B97A1D" text-anchor="middle">feedback to the narrator, up to 3 rounds</text><path d="M1060,458 L1176,458" fill="none" stroke="#8895A3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-8895A3)"/><rect x="48" y="556" width="1404" height="164" rx="12" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="1.3"/><text x="68" y="586" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="700" fill="#0F2236" text-anchor="start">From the demo run: a simulated faulty first draft, caught</text><text x="68" y="606" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#76879A" text-anchor="start">Real output of `python -m proofline demo`. The faulty draft is scripted to show the mechanism; it is not a measured model failure rate.</text><rect x="68" y="623" width="62" height="24" rx="12" fill="#FBF1DD" stroke="#B97A1D" stroke-width="1"/><text x="99" y="640" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#B97A1D" text-anchor="middle">rejected</text><text x="146" y="640" font-family="'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="400" fill="#0F2236" text-anchor="start">&quot;In 2026-10, E017 issued 37 invoices, a sharp jump.&quot;</text><text x="770" y="640" font-family="'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" font-weight="400" fill="#4A5B6E" text-anchor="start">fact_value_mismatch:invoices in month:claimed 37 actual 11</text><rect x="68" y="661" width="62" height="24" rx="12" fill="#FBF1DD" stroke="#B97A1D" stroke-width="1"/><text x="99" y="678" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#B97A1D" text-anchor="middle">rejected</text><text x="146" y="678" font-family="'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="400" fill="#0F2236" text-anchor="start">&quot;E017 committed tax fraud through a circular invoice scheme.&quot;</text><text x="770" y="678" font-family="'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" font-weight="400" fill="#4A5B6E" text-anchor="start">legal_conclusion:committed, legal_conclusion:fraud, no_evidence_cited, uncited_record_id:E017</text></svg>