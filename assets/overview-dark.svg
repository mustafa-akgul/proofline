<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Proofline overview"><defs><marker id="a-17324F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#8fb3dc"/></marker><marker id="a-1B766F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#4cc2b4"/></marker><marker id="a-B97A1D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#e2a94f"/></marker><marker id="a-8895A3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#6f8196"/></marker><marker id="a-0F2236" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#e8eef5"/></marker></defs><rect width="1200" height="540" fill="#0d1117"/><text x="52" y="62" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#e8eef5" text-anchor="start">How Proofline works</text><text x="52" y="94" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="400" fill="#9fb0c3" text-anchor="start">A model may draft. Code decides what is true. A human decides what to do.</text><rect x="52" y="118" width="200" height="150" rx="12" fill="#10272a" stroke="#4cc2b4" stroke-width="2"/><text x="70" y="152" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#4cc2b4" text-anchor="start">1</text><text x="234" y="152" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#4cc2b4" text-anchor="end" letter-spacing="1.2">CODE</text><text x="70" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="650" fill="#e8eef5" text-anchor="start">Plan and collect</text><text x="70" y="224" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c3" text-anchor="start">Every tool call goes</text><text x="70" y="248" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c3" text-anchor="start">through the gateway</text><path d="M255,193.0 L273,193.0" fill="none" stroke="#8fb3dc" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-17324F)"/><rect x="276" y="118" width="200" height="150" rx="12" fill="#10272a" stroke="#4cc2b4" stroke-width="2"/><text x="294" y="152" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#4cc2b4" text-anchor="start">2</text><text x="458" y="152" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#4cc2b4" text-anchor="end" letter-spacing="1.2">CODE</text><text x="294" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="650" fill="#e8eef5" text-anchor="start">Validate</text><text x="294" y="224" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c3" text-anchor="start">Re-read from source,</text><text x="294" y="248" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c3" text-anchor="start">check the numbers</text><path d="M479,193.0 L497,193.0" fill="none" stroke="#8fb3dc" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-17324F)"/><rect x="500" y="118" width="200" height="150" rx="12" fill="#151c26" stroke="#6f8196" stroke-width="2" stroke-dasharray="6 4"/><text x="518" y="152" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#6f8196" text-anchor="start">3</text><text x="682" y="152" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#6f8196" text-anchor="end" letter-spacing="1.2">DRAFT</text><text x="518" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="650" fill="#e8eef5" text-anchor="start">Narrate</text><text x="518" y="224" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c3" text-anchor="start">A model may draft</text><text x="518" y="248" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c3" text-anchor="start">claims, nothing more</text><path d="M703,193.0 L721,193.0" fill="none" stroke="#8fb3dc" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-17324F)"/><rect x="724" y="118" width="200" height="150" rx="12" fill="#10272a" stroke="#4cc2b4" stroke-width="2"/><text x="742" y="152" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#4cc2b4" text-anchor="start">4</text><text x="906" y="152" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#4cc2b4" text-anchor="end" letter-spacing="1.2">CODE</text><text x="742" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="650" fill="#e8eef5" text-anchor="start">Verify claims</text><text x="742" y="224" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c3" text-anchor="start">Recompute each figure,</text><text x="742" y="248" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c3" text-anchor="start">no legal conclusions</text><path d="M927,193.0 L945,193.0" fill="none" stroke="#8fb3dc" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-17324F)"/><rect x="948" y="118" width="200" height="150" rx="12" fill="#2b2314" stroke="#e2a94f" stroke-width="2"/><text x="966" y="152" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#e2a94f" text-anchor="start">5</text><text x="1130" y="152" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#e2a94f" text-anchor="end" letter-spacing="1.2">HUMAN</text><text x="966" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="650" fill="#e8eef5" text-anchor="start">Human review</text><text x="966" y="224" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c3" text-anchor="start">Approve, reject or</text><text x="966" y="248" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c3" text-anchor="start">ask for more evidence</text><path d="M824.0,272 L824.0,312 L600.0,312 L600.0,274" fill="none" stroke="#e2a94f" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-B97A1D)"/><text x="712.0" y="338" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#e2a94f" text-anchor="middle">rejected: rewrite</text><path d="M1048.0,272 L1048.0,364 L152.0,364 L152.0,274" fill="none" stroke="#e2a94f" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-B97A1D)"/><text x="376.0" y="390" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#e2a94f" text-anchor="middle">more evidence requested: re-plan</text><rect x="52" y="420" width="1096" height="78" rx="12" fill="#151c26" stroke="#8fb3dc" stroke-width="1.6"/><text x="76" y="452" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#8fb3dc" text-anchor="start">Policy and tool gateway</text><text x="76" y="480" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c3" text-anchor="start">Read-only, scoped per call, role-checked. Every decision goes into a hash-chained audit log.</text></svg>