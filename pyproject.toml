[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofline"
version = "0.1.0"
description = "Evidence-grounded investigation agent: a risk event becomes a verified, traceable case file, and a human decides."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mustafa Talha Akgül" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
proofline = "proofline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proofline = ["policy.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
